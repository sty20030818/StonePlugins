name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.18.0, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Verify release tag matches plugin version
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./plugins/stoneplugins/.codex-plugin/plugin.json').version")"
          test "$GITHUB_REF_NAME" = "$expected"
      - run: npm run typecheck
      - run: npm run build
      - run: git ls-files --error-unmatch plugins/stoneplugins/hooks/inject-context.js
      - run: git diff --exit-code -- plugins/stoneplugins/hooks/inject-context.js
      - run: npm run validate
      - name: Validate release artifacts
        if: github.ref_type == 'tag'
        run: npm run validate:release
      - run: node --test tests/inject-context.test.ts
