name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/validate-repository.mjs
      - run: node --check plugins/stonefish-engineering/hooks/inject-context.mjs
      - run: node --test tests/inject-context.test.mjs
